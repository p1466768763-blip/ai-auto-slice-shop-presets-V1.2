<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线剪辑页</title>
<style>
:root{--pink:#e94f95;--ink:#303133;--muted:#909399;--line:#e7ebf0;--bg:#f6f6fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#fff,#f4f6fa 42%);color:var(--ink);font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}.header{position:sticky;top:0;z-index:5;width:min(1180px,calc(100% - 48px));margin:14px auto 0;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:#ffffffeb;box-shadow:0 8px 24px #0f172a0a;backdrop-filter:blur(10px)}.titlebar,.headerActions,.actionbar,.panelHead,.row{display:flex;align-items:center;gap:8px}.titlebar{min-height:36px}.back{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:#fff}.title{font-size:18px;font-weight:650}.tag,.field span,.meta span{color:#687180}.headerActions{margin-left:auto}.sourceName{max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ghost,.primary,.actionbar button,.actionbar span{height:34px;padding:0 14px;border-radius:6px;border:1px solid var(--line);background:#fff}.primary{background:var(--pink);border-color:var(--pink);color:#fff}.workspace{width:min(1180px,calc(100% - 48px));margin:14px auto 28px;display:grid;grid-template-rows:auto auto;gap:14px}.primaryGrid{display:grid;grid-template-columns:92px minmax(320px,.9fr) minmax(340px,1fr);gap:14px;align-items:start}.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px #0f172a0d;min-height:0}.rail{padding:10px 8px;overflow:auto}.rail button{width:100%;height:64px;margin-bottom:8px;border:1px solid transparent;border-radius:10px;background:#f7f8fa;color:#687180}.rail button.active{background:#fff4f9;border-color:#edb7d0;color:var(--pink);font-weight:650} .preview{display:grid;grid-template-rows:auto auto;padding:14px;gap:12px} .stage{position:relative;height:min(58vh,560px);border-radius:12px;background:#111;overflow:hidden;display:grid;place-items:center}.stage img{width:auto;height:100%;max-width:100%;object-fit:cover;aspect-ratio:9/16}.subtitleOverlay{position:absolute;left:50%;bottom:18%;transform:translateX(-50%);width:min(72%,280px);padding:8px 12px;border-radius:6px;background:#00000073;color:#fff;text-align:center}.sticker{position:absolute;right:18%;top:18%;padding:8px 10px;border-radius:10px;background:#fff;color:var(--pink);font-weight:700}.mosaic{position:absolute;left:18%;top:24%;width:92px;height:70px;background:#bbb;filter:blur(4px);border:1px dashed #fff}.actionbar{justify-content:space-between}.config{padding:16px;max-height:min(58vh,560px);overflow:auto}.panelHead{justify-content:space-between;margin-bottom:12px;font-weight:650}.field{display:grid;gap:5px;margin:10px 0}.input,select,textarea{width:100%;border:1px solid #dcdfe6;border-radius:6px;padding:7px 9px}textarea{min-height:58px}.lines,.grid{display:grid;gap:8px}.grid{grid-template-columns:repeat(3,1fr)}.line{display:grid;grid-template-columns:24px 1fr auto;gap:7px;align-items:center}.line button{border:0;background:none;color:var(--pink)}.option{height:58px;border:1px solid var(--line);border-radius:8px;background:#fafbfc}.option.active{border-color:var(--pink);background:#fff4f9;color:var(--pink)}.timeline{padding:14px 16px 16px}.tracks{position:relative;border:1px solid var(--line);border-radius:10px;background:#fafbfc}.lane{height:46px;border-bottom:1px solid #edf0f4;display:flex;align-items:center;padding:7px}.clip{height:32px;border-radius:7px;background:linear-gradient(90deg,#312e81,#6366f1);color:#fff;display:flex;align-items:center;padding:0 10px}.playhead{position:absolute;top:0;bottom:0;width:2px;background:var(--pink);left:22%}.overlay{position:fixed;inset:0;background:#0f172a7a;display:grid;place-items:center}.dialog{width:min(460px,calc(100% - 32px));background:#fff;border-radius:14px;padding:22px}.progress{height:8px;background:#f2f2f2;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--pink)}.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.meta div{padding:9px;border:1px solid var(--line);border-radius:8px;background:#fafbfc}.hidden{display:none}@media(max-width:1100px){.header,.workspace{width:min(100% - 28px,1180px)}.primaryGrid{grid-template-columns:84px minmax(280px,1fr)}.config{grid-column:1/-1;max-height:none}.stage{height:min(50vh,520px)}}@media(max-width:700px){.header,.workspace{width:calc(100% - 20px)}.primaryGrid{grid-template-columns:1fr}.rail{display:flex;gap:8px}.rail button{width:82px;flex:none;margin-bottom:0}.titlebar{flex-wrap:wrap}.headerActions{width:100%;margin-left:0}.stage{height:62vw}}
</style>
</head>
<body>
<header class="header"><div class="titlebar"><button class="back" id="back" aria-label="返回">←</button><div><div class="title">在线剪辑页</div><div class="tag">直播切片 / 切片库 / 剪辑 · 演示素材 1184</div></div><div class="headerActions"><span class="sourceName">冰感防晒衣 · 12 秒</span><button class="ghost" id="download">导出草稿到剪映</button><button class="primary" id="next">前往发布</button></div></div></header>
<main class="workspace"><div class="primaryGrid">
<nav class="card rail" aria-label="剪辑工具"><button data-tool="subtitle" class="active">字幕</button><button data-tool="speed">变速</button><button data-tool="transition">转场</button><button data-tool="bgm">BGM</button><button data-tool="mosaic">马赛克</button><button data-tool="sticker">贴纸</button></nav>
<section class="card preview" aria-label="视频预览"><div class="stage"><img src="../assets/clip-covers/sneaker-red.jpg" alt="当前视频演示封面"><div class="subtitleOverlay" id="subtitleOverlay">这款商品的细节给大家看一下</div><div class="sticker hidden" id="stickerOverlay">LOOK</div><div class="mosaic hidden" id="mosaicOverlay"></div></div><div class="actionbar"><span id="timeLabel">00:02.4 / 00:12.0</span><div class="row"><button id="play">播放预览</button><button id="split">分割</button><button id="remove">删除</button><button id="fullscreen">全屏编辑</button></div></div></section>
<section class="card config" id="config" aria-live="polite"></section>
</div><section class="card timeline" aria-label="视频时间轴"><div class="panelHead"><span>时间轴</span><span id="timelineState">吸附到帧和片段边缘</span></div><div class="tracks"><div class="playhead" id="playhead"></div><div class="lane"><div class="clip" style="width:46%">视频片段 · 5.5 秒</div><div class="clip" style="width:38%;margin-left:8px;background:linear-gradient(90deg,#7c3aed,#c084fc)">视频片段 · 6.5 秒</div></div><div class="lane"><div class="clip" style="width:30%;background:#0f766e">字幕 1</div></div><div class="lane"><div class="clip" style="width:62%;background:#b45309">原声音轨</div></div></div></section></main>
<div class="overlay hidden" id="renderOverlay"><section class="dialog" role="dialog" aria-modal="true"><h2>正在生成视频</h2><div class="progress"><i id="renderBar"></i></div><p id="renderStatus">准备中</p><div class="meta"><div><span>分辨率</span><b>1080 × 1920</b></div><div><span>封装格式</span><b>MP4</b></div><div><span>视频编码</span><b>AVC</b></div><div><span>音频编码</span><b>Opus</b></div></div><div class="row" style="justify-content:flex-end"><button class="ghost" id="cancelRender">取消生成</button></div></section></div>
<script>
const panels={subtitle:'<div class="panelHead"><span>字幕设置</span><label><input id="subtitleEnabled" type="checkbox" checked> 启用字幕</label></div><button class="ghost" id="addSubtitle">+ 添加字幕</button><div class="lines" id="subtitleLines"></div><div class="field"><span>字体</span><select><option>思源黑体</option><option>思源宋体</option><option>霞鹜文楷</option><option>得意黑</option></select></div><div class="row"><label>颜色 <input id="fontColor" type="color" value="#ffffff"></label><label>字号 <input id="fontSize" type="number" value="28" style="width:70px"></label></div>',speed:'<div class="panelHead"><span>变速设置</span></div><div class="meta"><div><span>原始时长</span><b>12.0 秒</b></div><div><span>变速后</span><b id="speedDuration">10.0 秒</b></div></div><input id="speed" type="range" min="0.5" max="2" step="0.1" value="1.2">',transition:'<div class="panelHead"><span>转场特效</span></div><p>先选中视频片段，再选择转场特效。</p><input class="input" id="transitionSearch" placeholder="搜索转场"><div class="grid" id="transitions"></div>',bgm:'<div class="panelHead"><span>BGM库</span></div><button class="option active">轻快原声 · 12 秒</button><button class="option">店铺推广曲 · 8 秒</button><div class="field"><span>原声音量 <b id="volumeLabel">80%</b></span><input id="volume" type="range" min="0" max="100" value="80"></div>',mosaic:'<div class="panelHead"><span>马赛克</span><button class="ghost" id="addMosaic">+ 添加马赛克</button></div><p id="mosaicStatus">当前未添加马赛克。</p>',sticker:'<div class="panelHead"><span>贴纸</span></div><div class="grid"><button class="option" data-sticker="LOOK">LOOK</button><button class="option" data-sticker="BUY">BUY</button><button class="option" data-sticker="♥">♥</button></div>'};
const lines=['这款商品的细节给大家看一下','近距离看看面料和做工','日常搭配也很合适'];
const transitions=['淡入淡出','交叉缩放','圆形打开','万花筒','百叶窗','像素化','风车','爱心','涟漪'];
let tool='subtitle',playing=false,timer=null,progress=0,renderTimer=null;
function bindPanel(){document.querySelector('#addSubtitle')?.addEventListener('click',()=>{lines.push('新的字幕');renderPanel()});document.querySelectorAll('[data-line]').forEach(input=>input.oninput=()=>{lines[input.dataset.line]=input.value;document.querySelector('#subtitleOverlay').textContent=lines[0]||''});document.querySelectorAll('[data-delete-line]').forEach(button=>button.onclick=()=>{lines.splice(Number(button.dataset.deleteLine),1);renderPanel()});document.querySelector('#subtitleEnabled')?.addEventListener('change',event=>document.querySelector('#subtitleOverlay').classList.toggle('hidden',!event.target.checked));document.querySelector('#speed')?.addEventListener('input',event=>document.querySelector('#speedDuration').textContent=(12/Number(event.target.value)).toFixed(1)+' 秒');document.querySelector('#transitionSearch')?.addEventListener('input',renderTransitions);document.querySelectorAll('[data-transition]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-transition]').forEach(item=>item.classList.remove('active'));button.classList.add('active')});document.querySelector('#volume')?.addEventListener('input',event=>document.querySelector('#volumeLabel').textContent=event.target.value+'%');document.querySelector('#addMosaic')?.addEventListener('click',()=>{document.querySelector('#mosaicOverlay').classList.remove('hidden');document.querySelector('#mosaicStatus').textContent='已添加马赛克 1'});document.querySelectorAll('[data-sticker]').forEach(button=>button.onclick=()=>{const sticker=document.querySelector('#stickerOverlay');sticker.textContent=button.dataset.sticker;sticker.classList.remove('hidden')})}
function renderLines(){document.querySelector('#subtitleLines').innerHTML=lines.map((line,index)=>'<div class="line"><span>'+(index+1)+'</span><input class="input" data-line="'+index+'" value="'+line+'"><button data-delete-line="'+index+'">删除</button></div>').join('');document.querySelector('#subtitleOverlay').textContent=lines[0]||''}
function renderTransitions(){const query=document.querySelector('#transitionSearch')?.value||'';document.querySelector('#transitions').innerHTML=transitions.filter(item=>item.includes(query)).map(item=>'<button class="option" data-transition="'+item+'">'+item+'</button>').join('')||'<p>暂无匹配转场</p>'}
function renderPanel(){document.querySelector('#config').innerHTML=panels[tool];document.querySelectorAll('[data-tool]').forEach(button=>button.classList.toggle('active',button.dataset.tool===tool));if(tool==='subtitle')renderLines();if(tool==='transition')renderTransitions();bindPanel()}
document.querySelectorAll('[data-tool]').forEach(button=>button.onclick=()=>{tool=button.dataset.tool;renderPanel()});
document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'暂停预览':'播放预览';clearInterval(timer);if(playing)timer=setInterval(()=>{progress=(progress+2)%100;document.querySelector('#playhead').style.left=progress+'%';document.querySelector('#timeLabel').textContent='00:'+String(Math.floor(progress*12/100)).padStart(2,'0')+'.0 / 00:12.0'},180)};
document.querySelector('#split').onclick=()=>document.querySelector('#timelineState').textContent='已在当前时间分割选中片段';
document.querySelector('#remove').onclick=()=>document.querySelector('#timelineState').textContent='至少保留一个视频片段';
document.querySelector('#fullscreen').onclick=()=>document.body.requestFullscreen?.();
document.querySelector('#download').onclick=()=>document.querySelector('#timelineState').textContent='导出草稿到剪映（原型演示）';
document.querySelector('#back').setAttribute('aria-label','返回成片编辑');
document.querySelector('#back').title='返回成片编辑';
document.querySelector('#back').onclick=()=>{location.href=new URL('../live-slice-prototype.html',location.href).href;};
document.querySelector('#next').onclick=()=>{const context=new URLSearchParams(location.search);const target=new URL('../live-slice-prototype.html',location.href);target.searchParams.set('publish_task',context.get('task')||'131');target.searchParams.set('publish_clip',context.get('clip')||'0');target.searchParams.set('publish_from','online-edit');location.href=target.href;};
document.querySelector('#cancelRender').onclick=()=>{clearInterval(renderTimer);document.querySelector('#renderOverlay').classList.add('hidden');document.querySelector('#timelineState').textContent='已取消生成'};
renderPanel();
</script>
</body>
</html>
