itorState.active]?.text||''):''};const back=root.querySelector('#edBack');if(back)back.onclick=()=>openPreset('base');const next=root.querySelector('#edNext');if(next)next.onclick=()=>toast('已进入下一步：发布设置');root.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>toast(b.textContent+'（原型）'));root.querySelectorAll('[data-tl]').forEach(b=>b.onclick=()=>{const k=b.dataset.tl;if(k==='play'){editorState.playing=!editorState.playing;b.textContent=editorState.playing?'⏸':'▶';toast(editorState.playing?'开始播放':'已暂停');return}toast({undo:'已撤销',redo:'已重做',split:'已在播放头分割',del:'已删除选中片段',snap:'吸附已切换'}[k]||'已操作')});const z=root.querySelector('#edZoom');if(z)z.oninput=()=>{editorState.zoom=+z.value;const c=root.querySelector('.ed-clip');if(c)c.style.width=(72*editorState.zoom)+'%'};const font=root.querySelector('#edFont');if(font)font.value=editorState.font}

const lexiconState={hotWords:['湿剃','干剃','剃','剃须刀','飞利浦'],forbiddenWords:['第一','全网最低','秒杀','绝对','治愈'],query:'',targetPool:'hot'};
function renderLexicon(root){
 const q=lexiconState.query.trim();
 const filterWords=(list)=>list.map((w,i)=>({w,i})).filter(x=>!q||x.w.includes(q));
 const hotFiltered=filterWords(lexiconState.hotWords);
 const forbiddenFiltered=filterWords(lexiconState.forbiddenWords);
 const renderTag=(x,type)=>`<div class="lex-tag" data-type="${type}"><span>${x.w}</span><span class="lex-tag-del" data-deltype="${type}" data-delidx="${x.i}" title="删除">×</span></div>`;
 const hotHtml=hotFiltered.map(x=>renderTag(x,'hot')).join('')+`<div class="lex-tag lex-add-tag" data-addpool="hot" title="添加热词">+</div>`;
 const forbiddenHtml=forbiddenFiltered.map(x=>renderTag(x,'forbidden')).join('')+`<div class="lex-tag lex-add-tag" data-addpool="forbidden" title="添加违禁词">+</div>`;
 const totalUsed=lexiconState.hotWords.join('').length+lexiconState.forbiddenWords.join('').length;
 root.innerHTML=`<div class="lex"><div class="lex-head"><b>词库检测</b><span>支持人名、专有词等热词识别优化，以及违禁词自动过滤，最多支持340个字符</span><span class="lex-count">${totalUsed}/340</span></div><div class="lex-bar"><div class="lex-search"><input id="lxSearch" placeholder="输入关键词搜索" value="${q.replace(/"/g,'&quot;')}"><i>⌕</i></div><div class="spacer"></div><button class="lex-btn solid" id="lxUpload">批量上传</button></div><div class="lex-pools"><div class="lex-pool hot"><div class="lex-pool-header"><div class="lex-pool-title"><i></i>热词池</div><span class="lex-pool-count">${lexiconState.hotWords.length} 个词</span></div><div class="lex-tags">${hotHtml}</div></div><div class="lex-pool forbidden"><div class="lex-pool-header"><div class="lex-pool-title"><i></i>违禁词池</div><span class="lex-pool-count">${lexiconState.forbiddenWords.length} 个词</span></div><div class="lex-tags">${forbiddenHtml}</div></div></div></div>`;
 const search=root.querySelector('#lxSearch');search.oninput=()=>{lexiconState.query=search.value;renderLexicon(root)};
 root.querySelector('#lxUpload').onclick=()=>openBatchUploadDialog(root);
 root.querySelectorAll('[data-addpool]').forEach(btn=>btn.onclick=()=>openLexDialog(root,btn.dataset.addpool));
 root.querySelectorAll('.lex-tag-del').forEach(btn=>btn.onclick=(e)=>{e.stopPropagation();const t=btn.dataset.deltype;const idx=+btn.dataset.delidx;if(t==='hot'){lexiconState.hotWords.splice(idx,1);toast('已删除热词');}else{lexiconState.forbiddenWords.splice(idx,1);toast('已删除违禁词');}renderLexicon(root);});
}
function openBatchUploadDialog(root){
 const mask=document.createElement('div');mask.className='lex-mask';
 mask.innerHTML=`<div class="lex-dialog" style="width:520px"><h4>批量上传词库</h4><p style="font-size:12px;color:#909399;margin:-6px 0 16px">请选择上传分类，支持通过 Excel 表格批量导入对应词库</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px"><div class="lex-upload-card" id="upHotCard"><div style="font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:#e94f95;display:inline-block"></i>热词批量上传</div><p style="font-size:12px;color:#606266;margin:0 0 10px;line-height:1.4">上传后将合并导入至左侧热词池</p><button class="lex-btn ghost" style="width:100%" id="btnUpHot">选择文件上传</button><button class="lex-btn ghost" style="width:100%;margin-top:8px" id="btnTplHot">下载表格模板</button></div><div class="lex-upload-card" id="upForbiddenCard"><div style="font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px"><i style="width:8px;height:8px;border-radius:50%;background:#f56c6c;display:inline-block"></i>违禁词批量上传</div><p style="font-size:12px;color:#606266;margin:0 0 10px;line-height:1.4">上传后将合并导入至右侧违禁词池</p><button class="lex-btn ghost" style="width:100%;border-color:#fbc4c4;color:#f56c6c" id="btnUpForbidden">选择文件上传</button><button class="lex-btn ghost" style="width:100%;margin-top:8px;border-color:#fbc4c4;color:#f56c6c" id="btnTplForbidden">下载表格模板</button></div></div><div class="row"><button class="lex-btn ghost" id="batchClose">关闭</button></div></div>`;
 document.body.appendChild(mask);
 mask.querySelector('#batchClose').onclick=()=>mask.remove();

 mask.querySelector('#btnTplHot').onclick=()=>toast('已下载热词表格模板');
 mask.querySelector('#btnTplForbidden').onclick=()=>toast('已下载违禁词表格模板');
 mask.querySelector('#btnUpHot').onclick=()=>{
  const sample=['爆款','正品保证','官方自营'].filter(w=>!lexiconState.hotWords.includes(w));
  const nextLen=lexiconState.hotWords.join('').length+lexiconState.forbiddenWords.join('').length+sample.join('').length;
  if(nextLen>340){toast('导入后将超出340个字符上限');return;}
  lexiconState.hotWords.push(...sample);
  mask.remove();
  toast('已成功批量导入 '+sample.length+' 个热词');
  renderLexicon(root);
 };
 mask.querySelector('#btnUpForbidden').onclick=()=>{
  const sample=['第一名','国家级','全网独家'].filter(w=>!lexiconState.forbiddenWords.includes(w));
  const nextLen=lexiconState.hotWords.join('').length+lexiconState.forbiddenWords.join('').length+sample.join('').length;
  if(nextLen>340){toast('导入后将超出340个字符上限');return;}
  lexiconState.forbiddenWords.push(...sample);
  mask.remove();
  toast('已成功批量导入 '+sample.length+' 个违禁词');
  renderLexicon(root);
 };
}

function openLexDialog(root,pool='hot',lockPool=true){

 const radioHtml=lockPool?'':`<div style="display:flex;gap:16px;margin-bottom:14px"><label><input type="radio" name="pooldest" value="hot" ${pool==='hot'?'checked':''}> 热词池</label><label><input type="radio" name="pooldest" value="forbidden" ${pool==='forbidden'?'checked':''}> 违禁词池</label></div>`;

 const save=()=>{const v=input.value.trim();if(!v){toast('请输入内容');return;}const target=lockPool?pool:mask.querySelector('input[name="pooldest"]:checked').value;const list=target==='hot'?lexiconState.hotWords:lexiconState.forbiddenWords;if(list.includes(v)){toast('该词已存在于'+(target==='hot'?'热词池':'违禁词池'));return;}const totalLen=lexiconState.hotWords.join('').length+lexiconState.forbiddenWords.join('').length+v.length;if(totalLen>340){toast('超出340个字符上限');return;}list.push(v);mask.remove();toast('已添加到'+(target==='hot'?'热词池':'违禁词池'));renderLexicon(root);};

}

function ensureHostManagementLoaded(){
 if(hostManagementLoaded)return;

 const normalize=account=>({...clonePresetData(account),platform:String(account.platform||'').trim(),name:String(account.name||'').trim(),alias:String(account.alias||'').trim(),realName:String(account.realName||'').trim(),socialAccountName:String(account.socialAccountName||'').trim()});
 try{
  const raw=localStorage.getItem(hostManagementStorageKey);
  if(raw!==null){const value=JSON.parse(raw);if(!Array.isArray(value?.accounts)||!value.accounts.every(account=>account&&typeof account==='object'&&account.name))throw new Error('Invalid host data');hostState.accounts=value.accounts.map(normalize);return}
  // Merge legacy per-preset accounts once; retain every old storage entry as a recovery copy.
  const keys=new Set([...$('#presetSelect').options].map(option=>presetStorageKey(option.value,'host')));
  for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith('live-slice-prototype:preset:')&&key.endsWith(':host'))keys.add(key)}
  const accounts=new Map();
  for(const key of keys){
   let state;try{state=JSON.parse(localStorage.getItem(key)||'null')}catch{continue}
   const legacy=Array.isArray(state?.accounts)?state.accounts:state?.account?.name?[state.account]:[];
   for(const account of legacy){
    if(!account||typeof account!=='object'||!account.name)continue;
    const value=normalize(account),identity=JSON.stringify([value.platform,value.name]);
    if(!accounts.has(identity))accounts.set(identity,value);
    else{const existing=accounts.get(identity);for(const [field,content] of Object.entries(value))if(!existing[field]&&content)existing[field]=content}
   }

 }catch{hostManagementLoadError=true}
}

function capturePresetDraft(){

  [['.preset-strategy','strategy'],['.preset-ratios','ratio']].forEach(([selector,key])=>{const buttons=$$(selector+' button');const index=Math.max(0,Math.min(buttons.length-1,value[key]??0));buttons.forEach((b,i)=>b.classList.toggle('on',i===index))});if($('#presetDurationUnit'))$('#presetDurationUnit').value=value.durationUnit||'hour';if($('#presetDuration'))$('#presetDuration').value=value.duration||1;syncPresetQuantityOptions(value.quantity||1);renderPresetProducts(value.products||[]);
  $$('.preset-checks input').forEach((input,i)=>input.checked=value.filters[i]);

function renderPresetProducts(selected){const box=$('#presetProductPicker');if(!box)return;const products=getManagedProducts();const chosen=(selected||[]).filter(id=>products.some(product=>product.id===id));const byId=new Map(products.map(product=>[product.id,product]));box.innerHTML=(chosen.length?chosen.map(id=>{const product=byId.get(id);return '<span class="preset-product-chip" data-product-id="'+escapeJs(product.id)+'"><b>'+escapeHtml(product.name)+'</b><small>'+escapeHtml(product.id)+'</small><button type="button" data-remove-product="'+escapeJs(product.id)+'" aria-label="移除'+escapeJs(product.name)+'">×</button></span>'}).join(''):'<span class="preset-product-empty">尚未添加关键商品</span>')+'<button class="preset-product-add" id="presetProductAdd" type="button" aria-label="添加关键商品">+</button>';box.querySelectorAll('[data-remove-product]').forEach(button=>button.onclick=()=>renderPresetProducts(chosen.filter(id=>id!==button.dataset.removeProduct)));const add=box.querySelector('#presetProductAdd');add.onclick=()=>{if(!products.length){toast('请先在商品管理中添加商品');return}const available=products.filter(product=>!chosen.includes(product.id));if(!available.length){toast('商品管理中的商品已全部添加');return}const mask=document.createElement('div');mask.className='ai-live-modal';mask.innerHTML='<section class="ai-live-modal-box"><div class="ai-live-modal-head"><h3>选择关键商品</h3><button class="ai-live-close" type="button">×</button></div><p>从商品管理中选择商品，可一次添加多个。</p><div class="preset-product-options">'+available.map(product=>'<label><input type="checkbox" value="'+escapeJs(product.id)+'"><b>'+escapeHtml(product.name)+'</b><small>'+escapeHtml(product.id)+'</small></label>').join('')+'</div><div class="ai-live-actions"><button class="ai-live-secondary" id="presetProductCancel">取消</button><button class="ai-live-primary" id="presetProductConfirm">添加所选商品</button></div></section>';document.body.appendChild(mask);const close=()=>mask.remove();mask.onclick=event=>{if(event.target===mask)close()};mask.querySelector('.ai-live-close').onclick=mask.querySelector('#presetProductCancel').onclick=close;mask.querySelector('#presetProductConfirm').onclick=()=>{const ids=[...mask.querySelectorAll('input:checked')].map(input=>input.value);if(!ids.length){toast('请选择至少一个商品');return}close();renderPresetProducts([...chosen,...ids]);toast('已添加 '+ids.length+' 个关键商品')}};const panel=$('#presetKeyProducts');const strategyIndex=()=>$$('.preset-strategy button').findIndex(button=>button.classList.contains('on'));const sync=()=>{if(panel)panel.hidden=strategyIndex()!==0};sync();$$('.preset-strategy button').forEach(button=>button.addEventListener('click',()=>setTimeout(sync)))}
function syncPresetDurationOptions(){const unit=$('#presetDurationUnit'),duration=$('#presetDuration'),label=$('#presetDurationUnitLabel');if(!unit||!duration)return;const max=unit.value==='session'?3:24;const current=Math.min(max,Math.max(1,+duration.value||1));duration.innerHTML=Array.from({length:max},(_,i)=>'<option value=\"'+(i+1)+'\">'+(i+1)+'</option>').join('');duration.value=String(current);if(label)label.textContent=unit.value==='session'?'场输出':'小时输出'}
function syncPresetQuantityOptions(savedValue){const quantity=$('#presetQuantity');if(!quantity)return;const values=[...Array(20).keys()].map(i=>i+1).concat([30,40,50,60,70,80,90,100]);const current=Number(savedValue??quantity.value)||3;quantity.innerHTML=values.map(value=>'<option value=\"'+value+'\">'+value+'</option>').join('');quantity.value=String(values.reduce((closest,value)=>Math.abs(value-current)<Math.abs(closest-current)?value:closest))}

function parkPresetControl(){const control=$('#presetSetting');if(control){control.hidden=true;$('#aiWorkspaceBody').append(control)}}
function ensureSettingsDialog(title){
 let mask=$('#settingsDialogMask');
 if(!mask){
  mask=document.createElement('div');mask.id='settingsDialogMask';mask.className='settings-dialog-mask';
  mask.innerHTML='<section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="settingsDialogTitle"><header class="settings-dialog-heading"><div><small>'+ (activePresetKind==='edit'?'剪辑预设':'切片策略') +'</small><h2 id="settingsDialogTitle"></h2></div><button type="button" id="settingsDialogClose" aria-label="关闭设置">×</button></header><div id="settingsDialogBody" class="settings-dialog-body ai-workspace"></div></section>';
  document.body.append(mask);const previousOverflow=document.body.style.overflow;document.body.style.overflow='hidden';document.body.classList.add('settings-dialog-open');$('.shell').inert=true;
  const hasChildDialog=()=>!!document.querySelector('body>.highlight-mask,body>.ai-live-modal,body>.detail-preview');
  const close=()=>{capturePresetDraft();parkPresetControl();mask.remove();$('.shell').inert=false;document.body.style.overflow=previousOverflow;document.body.classList.remove('settings-dialog-open');document.removeEventListener('keydown',onKey);updateDefaultButton();syncHighlightDefaultStatus();$('#workspaceSettingsTrigger').focus()};
  const onKey=e=>{if(e.defaultPrevented||hasChildDialog())return;if(e.key==='Escape'){e.preventDefault();close();return}if(e.key==='Tab'){const nodes=[...mask.querySelectorAll('button,input,select,textarea,[tabindex]')].filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}};
  mask.querySelector('#settingsDialogClose').onclick=close;mask.onclick=e=>{if(e.target===mask&&!hasChildDialog())close()};document.addEventListener('keydown',onKey);
 }
 $('#settingsDialogTitle').textContent=title;$('#settingsDialogClose').focus();return $('#settingsDialogBody');
}

   renderAILive(target);workspace.querySelector('[data-ai-section="'+target+'"]').focus();

function bindWorkspaceSettings(){
 const root=$('#workspaceSettings'),trigger=$('#workspaceSettingsTrigger'),menu=$('#workspaceSettingsMenu'),items=[...menu.querySelectorAll('[role="menuitem"]')];
 const close=(focus=false)=>{menu.hidden=true;trigger.setAttribute('aria-expanded','false');if(focus)trigger.focus()};
 const open=()=>{menu.hidden=false;trigger.setAttribute('aria-expanded','true')};
 trigger.onclick=()=>{if(menu.hidden)open();else close()};
 trigger.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();open();items[e.key==='ArrowUp'?items.length-1:0].focus()}};
 root.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close(true);return}if(!items.includes(e.target))return;if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();const index=items.indexOf(e.target);items[e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length].focus()}};
 root.onfocusout=e=>{if(!root.contains(e.relatedTarget))close()};document.addEventListener('click',e=>{if(!root.contains(e.target))close()});
 items.forEach(button=>button.onclick=()=>{close();if(button.hasAttribute('data-setting-host'))renderHosts();else if(button.dataset.settingGlobal)openGlobalSetting(button.dataset.settingGlobal);else openPreset(button.dataset.settingPreset)});
}
